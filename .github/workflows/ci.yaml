name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/setup-gradle-environment

      - name: Build App APK (Debug)
        run: ./gradlew assembleDebug

      - name: Build App APK (Release)
        run: ./gradlew assembleRelease

  lint-and-formatting:
    name: Lint and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/setup-gradle-environment

      - name: Check Formatting
        run: ./gradlew spotlessCheck

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Upload Android Lint Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: app/build/reports/lint-debug-results.*
          if-no-files-found: warn
          retention-days: 7

  code-smell:
    name: Code smell analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/setup-gradle-environment

      - name: Analyse Code Smells
        run: ./gradlew detekt

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: app/build/reports/detekt/
          if-no-files-found: warn
          retention-days: 7

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/setup-gradle-environment

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: app/build/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec
          if-no-files-found: error
          retention-days: 1

  instrumentation-tests:
    name: Instrumentation tests - API 37
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/setup-gradle-environment

      - name: Enable and verify KVM
        shell: bash
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm is not available on this runner. Use a GitHub-hosted Linux runner with Android hardware acceleration enabled."
            lscpu
            exit 1
          fi

          sudo chmod 0666 /dev/kvm

          test -r /dev/kvm
          test -w /dev/kvm
          ls -la /dev/kvm

      # Necessário para o formato das imagens android-37.0/37.1.
      # Pode ser removido quando o runner/action já trouxer cmdline-tools 22+.
      - name: Update Android SDK command-line tools
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --install "cmdline-tools;latest" >/dev/null
          
          if [[ -d "$SDK/cmdline-tools/latest-2" ]]; then
            sudo rm -rf "$SDK/cmdline-tools/latest"
            sudo mv "$SDK/cmdline-tools/latest-2" \
              "$SDK/cmdline-tools/latest"
          fi
          
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Run instrumented tests on API 37
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30
        with:
          api-level: "37.0"
          target: google_apis
          arch: x86_64

          # Impede fallback silencioso para emulação sem KVM
          disable-linux-hw-accel: false

          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none

          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-test-reports
          path: |
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
            app/build/reports/coverage/androidTest/debug/connected/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload instrumentation coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-instrumentation
          path: app/build/outputs/code_coverage/debugAndroidTest/connected/**/*.ec
          if-no-files-found: error
          retention-days: 1

  test-coverage-validation:
    name: Test coverage validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    needs:
      - unit-tests
      - instrumentation-tests

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/setup-gradle-environment

      - name: Download unit coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-unit
          path: app/build/coverage-input/unit

      - name: Download instrumentation coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-instrumentation
          path: app/build/coverage-input/instrumentation

      - name: Generate combined coverage report
        run: ./gradlew jacocoAggregateReport --stacktrace

      - name: Validate combined coverage
        run: ./gradlew jacocoAggregateCoverageVerification --stacktrace

      - name: Upload combined JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-combined-report
          path: app/build/reports/jacoco/jacocoAggregateReport/
          if-no-files-found: warn
          retention-days: 7

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - qa

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execution permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build App APK
        run: ./gradlew assembleDebug

  lint-and-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execution permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Lint and Check Formatting
        run: ./gradlew spotlessCheck

  code-smell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execution permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Analyse Code Smells
        run: ./gradlew detekt

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execution permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

  instrumented-tests-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execution permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb devices -l
            adb wait-for-device
            adb devices -l
            
            adb shell getprop ro.build.version.sdk || true
            adb shell getprop sys.boot_completed || true
            
            ./gradlew jacocoTestCoverageVerification
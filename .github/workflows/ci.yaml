name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/setup-gradle-environment

      - name: Build App APK
        run: ./gradlew assembleDebug

  lint-and-formatting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/setup-gradle-environment

      - name: Lint and Check Formatting
        run: ./gradlew spotlessCheck

  code-smell:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/setup-gradle-environment

      - name: Analyse Code Smells
        run: ./gradlew detekt

  unit-tests-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/setup-gradle-environment

      - name: Run Unit Tests
        run: ./gradlew jacocoTestCoverageVerification